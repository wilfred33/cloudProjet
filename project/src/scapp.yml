version: "3.8"

services:
  # ============================================
  # BASES DE DONNÉES
  # ============================================

  # Base de données des utilisateurs
  users-db:
    image: wilfred33/kv-storage-system:latest
    ports: ["5984:5984"]
    volumes:
      - users-data:/opt/couchdb/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
    networks: ["scapp-network"]

  # Base de données des produits
  products-db:
    image: wilfred33/products-storage:latest
    ports: ["5985:5984"]
    volumes:
      - products-data:/opt/couchdb/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
    networks: ["scapp-network"]

  # Base de données du panier
  cart-db:
    image: wilfred33/cart-db-image:latest
    ports: ["5986:5984"]
    volumes:
      - cart-data:/opt/couchdb/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
    networks: ["scapp-network"]

  # Base de données de l'historique
  history-db:
    image: wilfred33/history-db-image:latest
    ports: ["5987:5984"]
    volumes:
      - history-data:/opt/couchdb/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
    networks: ["scapp-network"]

  # ============================================
  # MICROSERVICES
  # ============================================

  # Service d'authentification
  auth-service:
    image: wilfred33/scapp-auth:latest
    ports: ["8080:80"]
    depends_on:
      - users-db
    environment:
      - DB_HOST=users-db
      - DB_NAME=users
      - ADMIN_NAME=admin
      - ADMIN_PASSW=admin
      - TOKEN_SECRET=my-secret-token
      - WITH_PERSISTENT_DATA=Y
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == worker
    networks: ["scapp-network"]

  # Service des produits
  products-service:
    image: wilfred33/scapp-products:latest
    ports: ["8081:80"]
    depends_on:
      - products-db
    environment:
      - DB_HOST=products-db
      - DB_NAME=products
      - ADMIN_NAME=admin
      - ADMIN_PASSW=admin
      - WITH_PERSISTENT_DATA=Y
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == worker
    networks: ["scapp-network"]

  # Service du panier
  cart-service:
    image: wilfred33/scapp-cart:latest
    ports: ["8083:80"]
    depends_on:
      - cart-db
    environment:
      - DB_HOST=cart-db
      - DB_NAME=cart
      - ADMIN_NAME=admin
      - ADMIN_PASSW=admin
      - WITH_PERSISTENT_DATA=Y
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == worker
    networks: ["scapp-network"]

  # Service de l'historique
  history-service:
    image: wilfred33/scapp-history:latest
    ports: ["8084:80"]
    depends_on:
      - history-db
    environment:
      - DB_HOST=history-db
      - DB_NAME=history
      - ADMIN_NAME=admin
      - ADMIN_PASSW=admin
      - WITH_PERSISTENT_DATA=Y
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == worker
    networks: ["scapp-network"]

  # Service de recommandations
  recommendations-service:
    image: wilfred33/scapp-recommendations:latest
    ports: ["8085:80"]
    depends_on:
      - history-db
      - cart-db
      - products-db
    environment:
      - HISTORY_DB_HOST=history-db
      - CART_DB_HOST=cart-db
      - PRODUCTS_DB_HOST=products-db
      - ADMIN_NAME=admin
      - ADMIN_PASSW=admin
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == worker
    networks: ["scapp-network"]

  # ============================================
  # API GATEWAY
  # ============================================

  gateway:
    image: wilfred33/gateway-image:latest
    ports: ["8082:80"]
    depends_on:
      - auth-service
      - products-service
      - cart-service
      - history-service
      - recommendations-service
    environment:
      - AUTH_SERVICE=auth-service
      - PRODUCTS_SERVICE=products-service
      - CART_SERVICE=cart-service
      - HISTORY_SERVICE=history-service
      - RECOMMENDATIONS_SERVICE=recommendations-service
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
    networks: ["scapp-network"] 

  # ============================================
  # FRONTEND
  # ============================================

  frontend:
    image: wilfred33/frontend-image:latest
    ports: ["3000:3000"]
    depends_on:
      - gateway
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
    networks: ["scapp-network"]

  # ============================================
  # VISUALIZER - Interface de monitoring Swarm
  # ============================================

  visualizer:
    image: dockersamples/visualizer:stable
    ports: ["80:8080"]
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    deploy:
      placement:
        constraints:
          - node.role == manager
    networks: ["scapp-network"]

# ============================================
# RÉSEAU
# ============================================
networks:
  scapp-network:
    driver: overlay
    attachable: true 

# ============================================
# VOLUMES PERSISTANTS
# ============================================
volumes:
  users-data:
  products-data:
  cart-data:
  history-data:
